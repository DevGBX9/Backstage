import groovy.json.JsonSlurper

pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Jitpack'
			url = 'https://jitpack.io'
			content { includeGroupAndSubgroups('com.github') }
		}
		mavenCentral()
		gradlePluginPortal()
	}
	resolutionStrategy {
		eachPlugin {
			switch (requested.id.id) {
				case 'com.replaymod.preprocess': {
					useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
					break
				}
			}
		}
	}
}

def settings = new JsonSlurper().parseText(file('settings.json').text)

// Only the versions listed in "build_versions" are built.
// All other versions in "versions" are kept around for when they are enabled again.
def buildVersions = settings.build_versions ?: settings.versions

for (String version : buildVersions) {
	include(":$version")

	def proj = project(":$version")
	proj.projectDir = file("versions/$version")
	proj.buildFileName = '../../common.gradle'
}
